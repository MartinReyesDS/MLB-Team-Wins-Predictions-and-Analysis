&lt;style&gt;
#hitting-shortlist-fa-2023 .ps-caption{margin-top:12px;color:var(--muted-foreground)}
#hitting-shortlist-fa-2023 .ps-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
#hitting-shortlist-fa-2023 .ps-heading h3{margin:0}
#hitting-shortlist-fa-2023 .ps-list{list-style:none;padding:0;margin:10px 0 14px;display:grid;gap:10px}
#hitting-shortlist-fa-2023 .ps-entry{display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:10px;align-items:baseline}
#hitting-shortlist-fa-2023 .ps-rank{color:var(--muted-foreground);grid-row:1/4}
#hitting-shortlist-fa-2023 .ps-name{font-weight:500;overflow-wrap:anywhere}
#hitting-shortlist-fa-2023 .ps-value{font-weight:500}
#hitting-shortlist-fa-2023 .ps-meta{grid-column:2/4;color:var(--muted-foreground);margin:1px 0 4px}
#hitting-shortlist-fa-2023 .ps-track{grid-column:2/4;height:5px;background:color-mix(in srgb,var(--foreground) 6%,transparent)}
#hitting-shortlist-fa-2023 .ps-bar{height:100%;background:var(--viz-series-1);transition:width 250ms ease}
@media(prefers-reduced-motion:reduce){#hitting-shortlist-fa-2023 .ps-bar{transition:none}}
&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;hitting-shortlist-fa-2023&#x27;);
const data=JSON.parse(root.querySelector(&#x27;#hitting-data&#x27;).textContent);
const select=root.querySelector(&#x27;#hitting-stat&#x27;),list=root.querySelector(&#x27;#hitting-list&#x27;),availability=root.querySelector(&#x27;#hitting-availability&#x27;);
function signed(r){return (r&gt;=0?&#x27;+&#x27;:&#x27;−&#x27;)+Math.abs(r).toFixed(3);}
for(const stat of data){const option=document.createElement(&#x27;option&#x27;);option.value=stat.key;option.textContent=`${stat.label} (${stat.short}) · r = ${signed(stat.correlation)}`;select.append(option);}
select.value=&#x27;ops&#x27;;
function restore(state){const k=state?.modelContent?.statistic;if(data.some(s=&gt;s.key===k))select.value=k;availability.value=state?.modelContent?.availability===&#x27;all&#x27;?&#x27;all&#x27;:&#x27;fa&#x27;;}
restore(window.openai?.widgetState);
const entries=[];
for(let i=0;i&lt;15;i++){
 const li=document.createElement(&#x27;li&#x27;);li.className=&#x27;ps-entry&#x27;;
 const rank=document.createElement(&#x27;span&#x27;);rank.className=&#x27;ps-rank tabular-nums&#x27;;
 const name=document.createElement(&#x27;span&#x27;);name.className=&#x27;ps-name&#x27;;
 const value=document.createElement(&#x27;span&#x27;);value.className=&#x27;ps-value tabular-nums&#x27;;
 const meta=document.createElement(&#x27;span&#x27;);meta.className=&#x27;ps-meta text-small&#x27;;
 const track=document.createElement(&#x27;div&#x27;);track.className=&#x27;ps-track&#x27;;track.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
 const bar=document.createElement(&#x27;div&#x27;);bar.className=&#x27;ps-bar&#x27;;track.append(bar);
 li.append(rank,name,value,meta,track);list.append(li);entries.push({li,rank,name,value,meta,bar});
}
function render(){
 const stat=data.find(s=&gt;s.key===select.value);
 const pool=stat.players.filter(p=&gt;availability.value===&#x27;all&#x27;||p.freeAgent);
 const shown=pool.slice(0,15),max=Math.max(1,...shown.map(p=&gt;p.value));
 root.querySelector(&#x27;#hitting-heading&#x27;).textContent=`${stat.short} · r = ${signed(stat.correlation)}`;
 root.querySelector(&#x27;#hitting-direction&#x27;).textContent=stat.lower?&#x27;Lower is better ↓&#x27;:&#x27;Higher is better ↑&#x27;;
 root.querySelector(&#x27;#hitting-eligibility&#x27;).textContent=stat.group===&#x27;hitting&#x27;?`2023 regular season · 502+ plate appearances · ${stat.pool} eligible hitters`:`2023 regular season · 162+ innings · ${stat.pool} eligible pitchers`;
 entries.forEach(e=&gt;{e.li.hidden=true;e.li.style.display=&#x27;none&#x27;;});
 let prior=null,rank=0;
 shown.forEach((p,i)=&gt;{
 if(p.value!==prior)rank=i+1;prior=p.value;
 const el=entries[i];el.li.hidden=false;el.li.style.display=&#x27;&#x27;;el.rank.textContent=rank;el.name.textContent=p.name;el.value.textContent=p.display;
 el.meta.textContent=`${p.team} · ${p.workload}${p.freeAgent?&#x27; · &#x27;+p.freeAgentNote:&#x27;&#x27;}`;el.bar.style.width=(100*p.value/max)+&#x27;%&#x27;;
 el.li.setAttribute(&#x27;aria-label&#x27;,`Rank ${rank}: ${p.name}, ${stat.short} ${p.display}, ${p.team}, ${p.workload}`);
 });

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;pitching-shortlist-fa-2023&#x27;);
const data=JSON.parse(root.querySelector(&#x27;#pitching-data&#x27;).textContent);
const select=root.querySelector(&#x27;#pitching-stat&#x27;),list=root.querySelector(&#x27;#pitching-list&#x27;),availability=root.querySelector(&#x27;#pitching-availability&#x27;);
function signed(r){return (r&gt;=0?&#x27;+&#x27;:&#x27;−&#x27;)+Math.abs(r).toFixed(3);}
for(const stat of data){const option=document.createElement(&#x27;option&#x27;);option.value=stat.key;option.textContent=`${stat.label} (${stat.short}) · r = ${signed(stat.correlation)}`;select.append(option);}
select.value=&#x27;whip&#x27;;
function restore(state){const k=state?.modelContent?.statistic;if(data.some(s=&gt;s.key===k))select.value=k;availability.value=state?.modelContent?.availability===&#x27;all&#x27;?&#x27;all&#x27;:&#x27;fa&#x27;;}
restore(window.openai?.widgetState);
const entries=[];
for(let i=0;i&lt;15;i++){
 const li=document.createElement(&#x27;li&#x27;);li.className=&#x27;ps-entry&#x27;;
 const rank=document.createElement(&#x27;span&#x27;);rank.className=&#x27;ps-rank tabular-nums&#x27;;
 const name=document.createElement(&#x27;span&#x27;);name.className=&#x27;ps-name&#x27;;
 const value=document.createElement(&#x27;span&#x27;);value.className=&#x27;ps-value tabular-nums&#x27;;
 const meta=document.createElement(&#x27;span&#x27;);meta.className=&#x27;ps-meta text-small&#x27;;
 const track=document.createElement(&#x27;div&#x27;);track.className=&#x27;ps-track&#x27;;track.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
 const bar=document.createElement(&#x27;div&#x27;);bar.className=&#x27;ps-bar&#x27;;track.append(bar);
 li.append(rank,name,value,meta,track);list.append(li);entries.push({li,rank,name,value,meta,bar});
}
function render(){
 const stat=data.find(s=&gt;s.key===select.value);
 const pool=stat.players.filter(p=&gt;availability.value===&#x27;all&#x27;||p.freeAgent);
 const shown=pool.slice(0,15),max=Math.max(1,...shown.map(p=&gt;p.value));
 root.querySelector(&#x27;#pitching-heading&#x27;).textContent=`${stat.short} · r = ${signed(stat.correlation)}`;
 root.querySelector(&#x27;#pitching-direction&#x27;).textContent=stat.lower?&#x27;Lower is better ↓&#x27;:&#x27;Higher is better ↑&#x27;;

 entries.forEach(e=&gt;{e.li.hidden=true;e.li.style.display=&#x27;none&#x27;;});
 let prior=null,rank=0;
 shown.forEach((p,i)=&gt;{

    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
